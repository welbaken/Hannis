[package]
name = "dshpet"
version = "0.1.0"
edition = "2021"
description = "Standalone Windows desktop pet monitoring DSH/Hermes agents"
license = "MIT"

[lib]
name = "dshpet"
path = "src/lib.rs"

[[bin]]
name = "hannis"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
