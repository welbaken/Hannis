<style>
:root{ --accent:#c8e678; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{
  font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  background:#0d1420;
  background-image:
    radial-gradient(1100px 700px at 72% 16%, #26324a 0%, rgba(38,50,74,0) 62%),
    radial-gradient(900px 620px at 12% 88%, #1b2740 0%, rgba(27,39,64,0) 58%);
  color:#f2f5fa; overflow:hidden;
  user-select:none; -webkit-user-select:none;
}
/* 暗角:聚焦中央文字 */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(130% 100% at 50% 46%, transparent 62%, rgba(0,0,0,.42) 100%);
}
#bar{ position:fixed; top:0; left:0; height:3px; width:0; background:var(--accent);
  box-shadow:0 0 10px rgba(200,230,120,.55); transition:width .5s ease; z-index:40; }
.brand{ position:fixed; top:20px; left:26px; display:flex; align-items:center; gap:10px; opacity:.8; z-index:30; }
.brand img{ width:30px; height:30px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
.brand span{ font-size:14px; letter-spacing:.14em; color:rgba(255,255,255,.72); }

#stage{ position:fixed; inset:0; }
.line{
  position:absolute; left:50%; top:50%;
  width:min(86vw,1040px); text-align:center;
  font-size:clamp(26px,4.6vw,58px); font-weight:600; line-height:1.5;
  letter-spacing:.02em; text-wrap:balance;
  text-shadow:0 4px 26px rgba(0,0,0,.55);
  opacity:0; transform:translate(-50%,-50%) translateY(140px) scale(.62);
  transition:transform .55s cubic-bezier(.22,.9,.32,1), opacity .55s ease;
  will-change:transform,opacity; pointer-events:none;
}
.line .kw{ color:var(--accent); }

/* 指向右下角的箭头:可拖动,无论拖到哪都始终指向屏幕右下角(哈妮丝所在处) */
#arrow{
  position:fixed; z-index:20;
  width:clamp(96px,11vw,150px); aspect-ratio:1/1;
  cursor:grab; touch-action:none;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));
}
#arrow.drag{ cursor:grabbing; }
#arrow svg{ display:block; width:100%; height:100%; animation:nudge 1.9s ease-in-out infinite; }
@keyframes nudge{ 0%,100%{ transform:translate(0,0) } 50%{ transform:translate(13%,13%) } }

#counter{ position:fixed; left:26px; bottom:20px; z-index:30; font-size:13px; letter-spacing:.12em;
  color:rgba(255,255,255,.4); opacity:0; transition:opacity .4s; }
#hint{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:30; font-size:12.5px;
  white-space:nowrap; color:rgba(255,255,255,.34); opacity:0; transition:opacity .4s; }
body.started #counter, body.started #hint{ opacity:1; }

/* 语音设置(录制前调音) */
#gear{ position:fixed; top:16px; right:20px; z-index:60; width:36px; height:36px; border-radius:50%;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:#e5ebf4;
  font-size:17px; cursor:pointer; }
#gear:hover{ background:rgba(255,255,255,.15); }
#panel{ position:fixed; top:60px; right:20px; z-index:60; width:286px; padding:14px 16px;
  background:rgba(16,22,34,.94); border:1px solid rgba(255,255,255,.14); border-radius:14px;
  backdrop-filter:blur(10px); display:none; }
#panel.open{ display:block; }
#panel label{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#c7d0de; margin:9px 0; }
#panel label b{ width:34px; text-align:right; font-weight:600; color:#e9eef6; font-variant-numeric:tabular-nums; }
#panel select{ flex:1; min-width:0; background:#1a2334; color:#e9eef6; border:1px solid rgba(255,255,255,.16);
  border-radius:7px; padding:5px 6px; font-size:12px; }
#panel input[type=range]{ flex:1; accent-color:var(--accent); }
#panel .row{ display:flex; justify-content:flex-end; margin-top:10px; }
#panel button{ background:var(--accent); border:none; color:#233010; font-weight:700; border-radius:8px;
  padding:6px 16px; cursor:pointer; font-size:13px; }

/* 开始 / 结束覆盖层 */
#start,#end{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(9,13,21,.72); backdrop-filter:blur(6px); transition:opacity .45s; }
#start.off{ opacity:0; pointer-events:none; }
#end{ opacity:0; pointer-events:none; }
#end.on{ opacity:1; pointer-events:auto; }

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 朗读文本替换:让 TTS 念得更自然(屏幕显示不变) */
const SAY_MAP = [
  [/config\.json/gi, "config 点 jason"],
  [/readme\.md/gi, "readme 点 M D"],
  [/comfyui/gi, "Comfy UI"],
  [/webui/gi, "web UI"],
  [/dsh/gi, "D S H"],
  [/hermes/gi, "赫密斯"],
  [/maa/gi, "M A A"],
  [/\bcodex\b/gi, "Codex"],
  [/\bpng\b/gi, "P N G"],
  [/\blua\b/gi, "Lua"],
  [/\bai\b/gi, "A I"],
  [/……/g, "。"],
];
const sayText = t => SAY_MAP.reduce((s, [re, rep]) => s.replace(re, rep), t);

/* —— 预生成配音:由 scripts/gen_intro_voice.mjs 用 Qwen3-TTS 克隆声线批量合成,
      翻页时直接播放对应 wav;文件缺失或播放失败时回退到浏览器 TTS —— */
const CLIPS = LINES.map((_, i) => {
  const a = new Audio("intro_voice/line" + String(i).padStart(2, "0") + ".wav");
  a.preload = "auto"; a.volume = 1;
  a.addEventListener("error", () => {          // 播放中途文件损坏 → 当句回退 TTS
    if(playingClip === a){ playingClip = null; speakNow(LINES[i]); }
  });
  return a;
});
let playingClip = null;
function stopClip(){
  if(playingClip){ try{ playingClip.pause(); playingClip.currentTime = 0; }catch(_){} playingClip = null; }
}

/* —— 台词元素与翻页动画(当前句居中大字;看过的句缩小上推、渐隐;未到的句藏于下方) —— */
const stage = document.getElementById("stage");
const els = LINES.map(t => {
  const d = document.createElement("div");
  d.className = "line";
  d.innerHTML = esc(t).replace(KW, '<b class="kw">$1</b>');
  stage.appendChild(d);
  return d;
});
const bar = document.getElementById("bar"), counter = document.getElementById("counter");
let idx = -1;

function update(){
  const GAP = 30, S = .5;
  els.forEach((el, i) => {
    const off = i - idx;
    if(off === 0){
      el.style.transform = "translate(-50%,-50%) translateY(0px) scale(1)";
      el.style.opacity = 1; el.style.zIndex = 10;
    } else if(off > 0){
      el.style.transform = "translate(-50%,-50%) translateY(150px) scale(.62)";
      el.style.opacity = 0; el.style.zIndex = 1;
    }
  });
  // 历史句按各自实际高度动态堆叠(长句换行后不会互相压字),最多可见 3 句
  let y = 0, belowHalf = els[idx] ? els[idx].offsetHeight / 2 : 0;
  for(let d = 1; d <= 3 && els[idx - d]; d++){
    const el = els[idx - d];
    const half = el.offsetHeight * S / 2;
    y -= belowHalf + half + GAP;
    belowHalf = half;
    el.style.transform = `translate(-50%,-50%) translateY(${y}px) scale(${S})`;
    el.style.opacity = Math.max(0, .42 - .15 * (d - 1));
    el.style.zIndex = 9 - d;
  }
  for(let i = 0; i < idx - 3; i++){        // 更早的句:沿同一方向继续上移并隐藏
    els[i].style.transform = `translate(-50%,-50%) translateY(${y - 80 * (idx - 3 - i)}px) scale(${S})`;
    els[i].style.opacity = 0; els[i].style.zIndex = 1;
  }
  bar.style.width = idx >= 0 ? ((idx + 1) / LINES.length * 100) + "%" : "0";
  counter.textContent = idx >= 0 ? `${idx + 1} / ${LINES.length}` : "";
}
update();

/* —— TTS:自动优先中文少女声(晓晓 Xiaoxiao 等神经语音),可手动更换 —— */
const PREF = ["xiaoxiao","晓晓","xiaoyi","晓伊","yaoyao","瑶瑶","huihui","慧慧","tingting","婷婷",
              "google 普通话","meijia","wanwan","hiumaan","hiugaai"];
const vsel = document.getElementById("vsel");
const rateEl = document.getElementById("rate"), pitchEl = document.getElementById("pitch");
const hasTTS = "speechSynthesis" in window;
let voices = [], userPicked = false;

function scoreVoice(v){
  const n = (v.name || "").toLowerCase(), lang = (v.lang || "").toLowerCase().replace("_", "-");
  let s = -1;
  if(lang.startsWith("zh") || /chinese|中文|普通话|国语|粤语/.test(n)){
    s = 0;
    if(lang.startsWith("zh-cn") || lang === "zh") s += 20;   // 大陆口音优先
    if(/natural|online/.test(n)) s += 30;                    // Edge 神经语音更自然
    const hit = PREF.findIndex(p => n.includes(p));
    if(hit >= 0) s += 200 - hit;                             // 少女声优先名单
  }
  return s;
}
function loadVoices(){
  voices = speechSynthesis.getVoices() || [];
  const prev = vsel.value;
  const sorted = voices.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a));
  vsel.innerHTML = sorted.map(v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join("");
  if(prev && voices.some(v => v.voiceURI === prev)) vsel.value = prev;
  else if(!userPicked){
    const best = sorted.find(v => scoreVoice(v) > 0);
    if(best) vsel.value = best.voiceURI;
  }
}
if(hasTTS){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}else{
  document.getElementById("gear").style.display = "none";
}

/* gen 计数防止快速点击时旧句子排队播出 */
let gen = 0;
function speakNow(text){   /* 回退:浏览器本地 TTS */
  if(!hasTTS) return;
  const my = ++gen;
  try{ speechSynthesis.cancel(); }catch(_){}
  const u = new SpeechSynthesisUtterance(sayText(text));
  const v = voices.find(v => v.voiceURI === vsel.value);
  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "zh-CN";
  u.rate = +rateEl.value; u.pitch = +pitchEl.value; u.volume = 1;
  setTimeout(() => { if(my === gen){ try{ speechSynthesis.speak(u); }catch(_){} } }, 60);
}
function speakLine(i){     /* 播报第 i 句:优先预生成配音,失败回退 TTS */
  const my = ++gen;
  try{ speechSynthesis.cancel(); }catch(_){}
  stopClip();
  const clip = CLIPS[i];
  if(!clip){ speakNow(LINES[i]); return; }
  playingClip = clip;
  try{ clip.currentTime = 0; }catch(_){}
  const p = clip.play();
  if(p && p.catch) p.catch(() => {
    if(my === gen){ playingClip = null; speakNow(LINES[i]); }
  });
}

/* —— 翻页 —— */
const startOvl = document.getElementById("start"), endOvl = document.getElementById("end");
function begin(){
  startOvl.classList.add("off");
  document.body.classList.add("started");
  idx = 0; update(); speakLine(0);
}
function next(){
  if(!document.body.classList.contains("started")){ begin(); return; }
  if(idx >= LINES.length - 1){ endOvl.classList.add("on"); return; }
  idx++; update(); speakLine(idx);
}
function prev(){
  if(idx > 0){ idx--; update(); speakLine(idx); }
}

addEventListener("click", next);
startOvl.addEventListener("click", e => { e.stopPropagation(); begin(); });
endOvl.addEventListener("click", e => e.stopPropagation());
document.getElementById("replay").addEventListener("click", e => {
  e.stopPropagation();
  endOvl.classList.remove("on");
  idx = 0; update(); speakLine(0);
});

addEventListener("keydown", e => {
  if(e.key === "Escape"){ document.getElementById("panel").classList.remove("open"); return; }
  const t = e.target.tagName;
  if(t === "INPUT" || t === "SELECT" || t === "BUTTON") return;
  if(e.key === " " || e.key === "ArrowRight" || e.key === "Enter" || e.key === "PageDown"){ e.preventDefault(); next(); }
  else if(e.key === "ArrowLeft" || e.key === "Backspace" || e.key === "PageUp"){ e.preventDefault(); prev(); }
  else if(e.key === "r" || e.key === "R"){ if(idx >= 0) speakLine(idx); }
  else if(e.key === "f" || e.key === "F"){
    document.fullscreenElement ? document.exitFullscreen()
                               : document.documentElement.requestFullscreen().catch(() => {});
  }
});

/* —— 可拖动箭头:箭头始终把"尖端"对准屏幕右下角 —— */
const arrow = document.getElementById("arrow");
function placeArrow(cx, cy){
  const w = arrow.offsetWidth, h = arrow.offsetHeight;
  const x = Math.max(6, Math.min(innerWidth - w - 6, cx - w / 2));
  const y = Math.max(6, Math.min(innerHeight - h - 6, cy - h / 2));
  arrow.style.left = x + "px";
  arrow.style.top = y + "px";
  aimArrow();
}
function aimArrow(){
  const r = arrow.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const deg = Math.atan2(innerHeight - cy, innerWidth - cx) * 180 / Math.PI;
  arrow.style.rotate = (deg - 45) + "deg";   // 素材末端切线为 45°,修正到实际方位角
}
function resetArrow(){ placeArrow(innerWidth * .70, innerHeight * .70); }
resetArrow();
addEventListener("resize", aimArrow);

let drag = null;
arrow.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  const r = arrow.getBoundingClientRect();
  drag = { px: e.clientX, py: e.clientY, bx: r.left + r.width / 2, by: r.top + r.height / 2 };
  arrow.setPointerCapture(e.pointerId);
  arrow.classList.add("drag");
});
arrow.addEventListener("pointermove", e => {
  if(!drag) return;
  placeArrow(drag.bx + e.clientX - drag.px, drag.by + e.clientY - drag.py);
});
const endDrag = () => { drag = null; arrow.classList.remove("drag"); };
arrow.addEventListener("pointerup", endDrag);
arrow.addEventListener("pointercancel", endDrag);
arrow.addEventListener("click", e => e.stopPropagation());
arrow.addEventListener("dblclick", e => { e.stopPropagation(); resetArrow(); });

/* —— 设置面板 —— */
const gear = document.getElementById("gear"), panel = document.getElementById("panel");
/* 全部预生成配音加载成功后隐藏齿轮(面板仅用于 TTS 回退调音) */
let clipReady = 0;
CLIPS.forEach(a => a.addEventListener("canplaythrough", () => {
  if(++clipReady === CLIPS.length) gear.style.display = "none";
}, { once: true }));
gear.addEventListener("click", e => { e.stopPropagation(); panel.classList.toggle("open"); });
panel.addEventListener("click", e => e.stopPropagation());
vsel.addEventListener("change", () => { userPicked = true; });
rateEl.addEventListener("input", () => document.getElementById("ratev").textContent = (+rateEl.value).toFixed(2));
pitchEl.addEventListener("input", () => document.getElementById("pitchv").textContent = (+pitchEl.value).toFixed(2));
document.getElementById("test").addEventListener("click", () => speakLine(idx >= 0 ? idx : 0));
</script>
</body>
</html>
